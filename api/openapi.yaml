# Vizra core — canonical public API contract.
#
# THIS FILE IS THE API SOURCE (ADR-002 § Contracts). Routes are written here
# first and implemented second. `make openapi-verify` fails in both directions:
# a route served by cmd/api that has no operation here, and an operation here
# that cmd/api does not serve.
#
# The core<->search INTERNAL contract is NOT in this file. It lives beside it in
# `api/search-internal.openapi.yaml`, because core is the client of those routes
# and never serves them, and because `vizra-user` generates its TypeScript client
# from this file and must never gain internal HMAC operations. See
# docs/plans/2026-09-20-vizra-core-pr1-foundation.md § "Internal search contract
# placement".
openapi: 3.0.3

info:
  title: Vizra core API
  description: |
    Public HTTP API of `vizra-core`. In M0 this contract carries only the four
    operational probes; product surfaces arrive with their own slices and are
    added here before they are implemented.
  version: 0.1.0
  license:
    name: See LICENSE in the vizra-core repository
  contact:
    name: Vizra
    url: https://github.com/yegamble/vizra

servers:
  - url: "{publicOrigin}"
    description: The configured public origin of the instance.
    variables:
      publicOrigin:
        default: http://localhost:8080

tags:
  - name: setup
    description: |
      First-run owner claim (VZ-INSTALL-003). Unauthenticated by design: before
      an owner exists there is no principal to authenticate. The credential is
      the one-time claim token carried in the request body, never ambient, so
      these operations are not protected by a session or a CSRF token but by
      token entropy, single use enforced by a database constraint, a
      failure-keyed rate limit, and a strict content-type and origin posture.

      While the instance is unclaimed these two operations and the four probes
      are the ONLY reachable routes; everything else answers 403.
  - name: probes
    description: |
      Liveness, readiness, build identity and schema state. These operations are
      unauthenticated by design: they carry no user data, no credentials, no
      signed URLs and no private metadata (ADR-002 § Logging and redaction).

paths:
  /healthz:
    get:
      tags: [probes]
      operationId: getHealthz
      summary: Liveness probe
      description: |
        Liveness only. Returns 200 as long as the process is running and has not
        been asked to drain. It performs no dependency I/O, so it never turns red
        because PostgreSQL or the cache is down — that is `/readyz`.
      security: []
      responses:
        "200":
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "503":
          description: The process is draining and will stop accepting work.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"

  /readyz:
    get:
      tags: [probes]
      operationId: getReadyz
      summary: Readiness probe
      description: |
        Drain-aware readiness with a 2 second single-flight cache (ADR-002
        § Probes). PostgreSQL unreachable yields 503 `unavailable`. Every other
        degraded dependency — cache unreachable, search misconfigured or
        unreachable (Q-001), oldest queued job above the configured age
        threshold (Q-028) — yields 200 `degraded` with the component named, so a
        degraded instance keeps serving reads instead of being pulled out of
        rotation.
      security: []
      responses:
        "200":
          description: Ready. `status` is `ok` or `degraded`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"
        "503":
          description: Not ready. PostgreSQL is unreachable, or the process is draining.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadinessResponse"

  /version:
    get:
      tags: [probes]
      operationId: getVersion
      summary: Build identity
      description: |
        Reports the release tag, commit, build time, Go toolchain, container
        image digest, the libvips version and loader list recorded at image
        build time (ADR-001), and the maximum migration version embedded in this
        binary. The loader list is the only detector for a codec that entered the
        image silently, so it is served, not merely logged.
      security: []
      responses:
        "200":
          description: Build identity of the running binary and image.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionResponse"

  /schemaz:
    get:
      tags: [probes]
      operationId: getSchemaz
      summary: Migration ledger state
      description: |
        Always returns 200 (ADR-002 § Probes), including when the ledger is dirty
        or behind, because `vizra update` and the deploy scripts read this to
        decide whether an image may be rolled out and must be able to distinguish
        "behind" from "unreachable". A schema problem is reported in the body,
        never as a transport error.
      security: []
      responses:
        "200":
          description: Migration ledger state. Always 200.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SchemaResponse"

  /api/v1/setup/claim-status:
    get:
      tags: [setup]
      operationId: getSetupClaimStatus
      summary: Whether this instance has an owner yet
      description: |
        Returns exactly one bit. It deliberately does NOT report when a token was
        minted, when it expires, its generation, whether one is currently live, a
        user count, or the owner's identity: the claim page needs one bit to
        choose between the form and the "already claimed" screen, and every other
        field would be secret material, a freshness oracle for a token-guessing
        attacker, or an enumeration aid.

        `claimed: false` does advertise an unclaimed instance, but so does the
        public claim page and an empty gallery; concealment there would be
        illusory while the token remains the real control.
      security: []
      responses:
        "200":
          description: The claim state of this instance.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupClaimStatus"
        "429":
          description: |
            Too many requests to this route. It carries its own hard ceiling,
            separate from the claim endpoint's, so a flood here can never spend
            the budget a claim needs.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The instance state could not be read.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /api/v1/setup/claim-owner:
    post:
      tags: [setup]
      operationId: claimOwner
      summary: Redeem the one-time token and create the owner account
      description: |
        Exchanges the one-time claim token for THE owner account, exactly once.
        The operator obtains a token with `vizra claim-token` (whose output goes
        to their terminal, not to the container log).

        NO SESSION IS ESTABLISHED at this milestone: sessions arrive with
        VZ-AUTH-001, and this response therefore sets no cookie. A client must
        send the new owner to the sign-in page. `Set-Cookie` will be added to
        this same operation by that slice, which is a backward-compatible change.

        `Content-Type` must be `application/json`; unknown properties are
        refused; the body is bounded at 8 KiB. If `Origin` is present it must
        equal the instance's configured public origin, and if `Sec-Fetch-Site` is
        present it must be `same-origin` or `none` — absence of both is allowed
        so non-browser clients work.

        A refused token returns ONE message for every cause — mistyped,
        malformed, already redeemed, superseded by a re-mint, expired, or never
        minted. The server cannot distinguish them from a digest comparison, and
        separate messages would be both inaccurate and an oracle.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimOwnerRequest"
      responses:
        "201":
          description: The owner account was created. No session is established.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimOwnerResponse"
        "400":
          description: A field is missing, unknown or outside its bounds.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: |
            The claim token was not accepted (`forbidden`), or the request Origin
            did not match this instance's public origin (`origin_mismatch`).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: This instance already has an owner.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "413":
          description: The request body exceeded 8 KiB.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "415":
          description: The request was not `application/json`.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Too many failed attempts, or the hard request ceiling was reached.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: The database was unreachable, or hashing capacity was exhausted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    SetupClaimStatus:
      type: object
      additionalProperties: false
      required: [claimed]
      properties:
        claimed:
          type: boolean
          description: Whether this instance already has an owner account.

    ClaimOwnerRequest:
      type: object
      additionalProperties: false
      required: [token, username, email, password]
      properties:
        token:
          type: string
          pattern: "^[0-9a-fA-F]{64}$"
          description: |
            The one-time claim token: 64 hexadecimal characters (256 bits).
            Surrounding whitespace is trimmed and the value is case-insensitive.
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: "^[A-Za-z0-9][A-Za-z0-9_-]{2,29}$"
          description: |
            3 to 30 characters: letters, numbers, hyphen or underscore, starting
            with a letter or number. Compared case-insensitively for uniqueness.
        email:
          type: string
          maxLength: 254
          pattern: "^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$"
          description: |
            At most 254 BYTES — the server bound is `octet_length`, not a
            character count, so a non-ASCII address may be refused before it
            reaches 254 characters. Stored for later account recovery; this
            release sends no email.
        password:
          type: string
          minLength: 12
          maxLength: 256
          description: |
            At least 12 characters and at most 256, and at most 1024 BYTES.
            Hashed with argon2id as raw UTF-8 with no Unicode normalisation.

    ClaimOwnerResponse:
      type: object
      additionalProperties: false
      required: [username, role]
      properties:
        username:
          type: string
          description: |
            The owner's username, which is the public handle for an account.
            The internal identifier is deliberately not returned.
        role:
          type: string
          enum: [owner]


    HealthResponse:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, draining]
          description: "`ok` while serving; `draining` after SIGTERM."
      example:
        status: ok

    ComponentStatus:
      type: string
      enum: [ok, degraded, unavailable, off]
      description: |
        `off` means the component is deliberately not configured (for example
        `SEARCH_MODE=off`) and is not a fault. A configured-but-unreachable
        component is `unavailable` or `degraded`, never `off` — Q-001 forbids a
        silent fallback.

    ReadinessComponent:
      type: object
      additionalProperties: false
      required: [name, status]
      properties:
        name:
          type: string
          description: Stable component identifier.
          enum: [database, cache, search, worker, storage]
        status:
          $ref: "#/components/schemas/ComponentStatus"
        detail:
          type: string
          description: |
            Short human-readable reason. Must never contain credentials, DSNs,
            signed URLs, session ids or API keys (ADR-002 § Logging and
            redaction).

    ReadinessResponse:
      type: object
      additionalProperties: false
      required: [status, components, checked_at]
      properties:
        status:
          type: string
          enum: [ok, degraded, unavailable]
        components:
          type: array
          items:
            $ref: "#/components/schemas/ReadinessComponent"
        checked_at:
          type: string
          format: date-time
          description: When this result was computed; may be up to 2 s old (single-flight cache).
      example:
        status: degraded
        components:
          - name: database
            status: ok
          - name: cache
            status: degraded
            detail: "cache unreachable; using in-process rate limiter"
          - name: search
            status: "off"
          - name: worker
            status: ok
        checked_at: "2026-09-20T10:00:00Z"

    LibvipsInfo:
      type: object
      additionalProperties: false
      required: [version, loaders]
      properties:
        version:
          type: string
          description: libvips version the image was built against (ADR-001).
          example: 8.18.6
        loaders:
          type: array
          description: |
            The loader list recorded from `vips -l` at image build time. An
            unexpected entry here is how a codec that entered the image silently
            is detected.
          items:
            type: string

    VersionResponse:
      type: object
      additionalProperties: false
      required: [release, commit, built_at, go_version, schema_version]
      properties:
        release:
          type: string
          description: Release tag, or `dev` for an unreleased build.
          example: dev
        commit:
          type: string
          description: Source commit of this binary.
        built_at:
          type: string
          format: date-time
        go_version:
          type: string
          example: go1.27.1
        image_digest:
          type: string
          nullable: true
          description: Index digest of the running container image; null outside a container.
        libvips:
          allOf:
            - $ref: "#/components/schemas/LibvipsInfo"
          nullable: true
          description: Null in binaries built without the libvips image layer (for example `cmd/api` running from source).
        schema_version:
          type: integer
          format: int64
          description: Highest migration version embedded in this binary.
        modules:
          type: object
          description: Selected pinned module versions, for operator diagnosis.
          additionalProperties:
            type: string

    SchemaResponse:
      type: object
      additionalProperties: false
      required: [applied_version, embedded_version, dirty, state]
      properties:
        applied_version:
          type: integer
          format: int64
          description: Highest migration version applied to the connected database. 0 on an empty database.
        embedded_version:
          type: integer
          format: int64
          description: Highest migration version embedded in this binary.
        dirty:
          type: boolean
          description: True when the migration ledger records a failed migration. Reported, never auto-repaired.
        state:
          type: string
          enum: [current, behind, ahead, dirty, unknown]
          description: |
            `behind` — the database is older than this binary, run `vizra migrate`.
            `ahead` — the database is newer than this binary; `vizra update` refuses
            to roll this image out (ADR-002 § Rollback floor).
            `unknown` — the ledger could not be read; still 200.
        detail:
          type: string
          description: Short reason when `state` is `dirty` or `unknown`. Never contains a DSN.

    Error:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable error code.
            message:
              type: string
              description: Human-readable message. Never contains credentials or private metadata.
            request_id:
              type: string
