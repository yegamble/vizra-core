# docker-build — the release image (ADR-001 § Image and video). A floor lane.
#
# It builds for linux/amd64 only in CI. The owner's machine is arm64 and cannot
# build an emulated amd64 image with the disk it has, so this runner is the
# proof for the image, not the laptop (ADR-009). Multi-arch publication is a
# release concern (VZ-UPGRADE-001), not this lane.
name: docker-build

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  docker-build:
    name: docker-build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git rev-parse HEAD^1` needs the parent OBJECT; a depth-1 clone
          # grafts it away (measured). This is a fetch depth, NOT a `ref:` pin:
          # refs/pull/N/merge is still the tree that is tested.
          fetch-depth: 2

      # Provenance. On a `pull_request`, actions/checkout with no `ref:` checks
      # out refs/pull/N/merge — the head merged into the CURRENT base tip — so
      # the tree these commands run against is NEITHER the head SHA nor the
      # base SHA, and it moves whenever the base branch moves (meta-PR3
      # FINDING 5). The checkout is deliberately NOT pinned to the head.
      - name: Provenance — which tree this lane tested
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/provenance.sh

      # Every FROM must carry an @sha256 digest. A floating tag would let the
      # base change under a tag that is supposed to be reproducible, which is
      # the point of recording a loader list at all.
      - name: Assert every FROM is digest-pinned
        run: |
          set -euo pipefail
          bad=0
          while IFS= read -r line; do
            ref=$(printf '%s' "$line" | awk '{print $2}')
            case "$ref" in
              *@sha256:*) echo "  ok   $ref" ;;
              # A stage reference (FROM build AS x) is not an image.
              gobuild|vips|build|runtime) echo "  ok   internal stage $ref" ;;
              *) echo "::error::FROM $ref is not digest-pinned"; bad=1 ;;
            esac
          done < <(grep -E '^FROM ' Dockerfile)
          [ $bad -eq 0 ]

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: vizra-core:ci
          platforms: linux/amd64
          build-args: |
            RELEASE=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The loader list is the only detector for a codec that entered the image
      # silently, so it is asserted here rather than merely recorded.
      - name: Assert the codec surface
        run: |
          set -euo pipefail
          echo "--- vizra version ---"
          docker run --rm vizra-core:ci /usr/local/bin/vizra version

          loaders=$(docker run --rm vizra-core:ci /usr/local/bin/vizra version --json | jq -r '.libvips.loaders | join(",")')
          echo "loaders: $loaders"
          [ -n "$loaders" ] || { echo "::error::the image reports no libvips loader list"; exit 1; }

          # x265 is NEVER in any image (ADR-001). HEIC decode exists only in the
          # HEIC option image, which this is not.
          for banned in x265 heif heic; do
            if printf '%s' "$loaders" | grep -qi "$banned"; then
              echo "::error::excluded codec '$banned' is present in the image loader list"
              exit 1
            fi
          done
          echo "no excluded codec is present"

          echo "--- libvips version recorded at build ---"
          docker run --rm vizra-core:ci cat /usr/share/vizra/build/libvips-version.txt

      - name: Assert the image does not run as root
        run: |
          set -euo pipefail
          uid=$(docker run --rm vizra-core:ci id -u)
          echo "image uid: $uid"
          [ "$uid" != "0" ] || { echo "::error::the release image runs as root"; exit 1; }

      # ADR-001: the libvips layer sits BELOW the Go binary layer, so a Go
      # change never rebuilds libvips and the codec surface of a tag is stable
      # across rebuilds.
      #
      # The assertion is on buildx's CACHED marker for the libvips step, NOT on
      # whether the log mentions meson: buildx echoes a cached step's full
      # command text, so grepping for "meson compile" matches even when the step
      # was reused. That false positive failed this lane on the first run.
      - name: Assert a Go change does not rebuild libvips
        run: |
          set -euo pipefail
          printf '\n// layer-order probe\n' >> cmd/api/main.go
          rc=0
          docker buildx build --load -t vizra-core:ci2 \
            --progress=plain --cache-from type=gha --build-arg RELEASE=ci . > /tmp/rebuild.log 2>&1 || rc=$?
          git checkout -- cmd/api/main.go
          if [ $rc -ne 0 ]; then
            echo "::error::the rebuild itself failed"; tail -40 /tmp/rebuild.log; exit $rc
          fi

          python3 - <<'EOF'
          import re, sys

          log = open('/tmp/rebuild.log', errors='replace').read()

          # Find the step number buildx gave the libvips compile step.
          step = None
          for m in re.finditer(r'^#(\d+)\s+\[vips \d+/\d+\]\s+(.*)$', log, re.M):
              if 'meson compile' in m.group(2):
                  step = m.group(1)
                  break
          if step is None:
              print('::error::could not find the libvips build step in the rebuild log; '
                    'the assertion cannot be made and must not silently pass')
              sys.exit(1)

          print(f'libvips build step is #{step}')
          if re.search(rf'^#{step} CACHED\s*$', log, re.M):
              print(f'#{step} CACHED — a Go-only change reused the libvips layers')
              sys.exit(0)

          print(f'::error::step #{step} (libvips) was NOT cached on a Go-only change. '
                'The libvips layer must sit below the Go binary layer (ADR-001).')
          for line in log.splitlines():
              if line.startswith(f'#{step} '):
                  print('   ' + line)
          sys.exit(1)
          EOF
