# build-test — the unit gate. Named in .github/required-checks.txt and in the
# FLOOR_LANES of scripts/ci-required-guard.sh, so it cannot be removed by the
# pull request it gates.
name: build-test

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The half of the append-only guarantee that scripts/migration-manifest.sh
  # cannot make on its own.
  #
  # `migration-manifest.sh check` compares the manifest to the files ON DISK in
  # the same commit. That is self-consistency: `make migrations-manifest`
  # regenerates every hash and turns it green again, so on its own it catches
  # the honest mistake and not the deadline-pressure edit. A production database
  # that already applied 0002 never re-applies it, so an edited migration means
  # the repository and the live schema diverge permanently while every gate is
  # green.
  #
  # This job diffs the manifest against the MERGE BASE and fails when a line is
  # removed or changed, or when a migration file is deleted or renamed. Adding a
  # migration passes.
  append-only:
    name: append-only
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history: a merge-base diff needs more than a shallow clone.
          fetch-depth: 0

      # This lane computes a merge base and ECHOES A SHA, and until sweep B1 it
      # did so without saying which tree it was standing in — the exact shape of
      # meta-PR3 FINDING 5, and the last required lane that still had it
      # (PR#6 VERIFY, FINDING 4). `provenance.sh` is a control, not a printout:
      # it exits 1 when the checkout is pinned to the head (no HEAD^2) and when
      # HEAD^2 is not the PR head SHA. scripts/ci-required-guard.py check 10 now
      # asserts every checked lane that checks out also runs it.
      - name: Provenance — which tree this lane tested
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/provenance.sh

      - name: Merged migrations are frozen
        env:
          # On pull_request this is the target branch. On merge_group the queue
          # branch encodes the base, and GITHUB_BASE_REF is empty, so fall back
          # to the default branch.
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          base_ref="${BASE_REF:-}"
          if [ -z "$base_ref" ]; then
            base_ref="${{ github.event.repository.default_branch }}"
            echo "no base_ref for event '${{ github.event_name }}'; comparing against the default branch '$base_ref'"
          fi
          # `--depth=0` is not a thing; actions/checkout with fetch-depth: 0
          # already has the full history of HEAD, but the BASE branch may have
          # no local ref, so fetch it explicitly into refs/remotes.
          git fetch --no-tags origin "+refs/heads/${base_ref}:refs/remotes/origin/${base_ref}"
          base="$(git merge-base "origin/${base_ref}" HEAD)"
          echo "merge base: $base"

          fail=0

          # 1. A manifest line REMOVED or CHANGED means a merged migration's
          #    bytes moved. Added lines (a new migration) are fine.
          removed="$(git diff "$base" -- migrations/manifest.sha256 | grep -E '^-[0-9a-f]{64} ' || true)"
          if [ -n "$removed" ]; then
            echo "::error::a migrations/manifest.sha256 line was REMOVED or CHANGED."
            printf '%s\n' "$removed" | sed 's/^/    /'
            echo ""
            echo "A database that already applied that migration will never re-apply it, so the"
            echo "repository and the live schema would diverge permanently while every gate stayed"
            echo "green. Fix a merged migration with a NEW migration."
            fail=1
          fi

          # 2. A migration file deleted or renamed is the same violation wearing
          #    a different hat.
          gone="$(git diff --diff-filter=DR --name-only "$base" -- 'migrations/*.sql' || true)"
          if [ -n "$gone" ]; then
            echo "::error::migration file(s) deleted or renamed:"
            printf '%s\n' "$gone" | sed 's/^/    /'
            fail=1
          fi

          # 3. And the manifest must still match the files on disk, so the two
          #    halves cannot disagree.
          ./scripts/migration-manifest.sh check

          if [ "$fail" -ne 0 ]; then exit 1; fi

          added="$(git diff "$base" -- migrations/manifest.sha256 | grep -cE '^\+[0-9a-f]{64} ' || true)"
          echo "append-only: ok ($added migration file hash(es) added, none removed or changed)"

  build-test:
    name: build-test
    # GitHub-hosted ubuntu-24.04 is the clean target (ADR-009). The owner's
    # machine is arm64 and is not a substitute.
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    services:
      postgres:
        # postgres:18, digest resolved 2026-09-20 (ADR-001).
        image: postgres@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        env:
          POSTGRES_USER: vizra
          # NO PASSWORD AT ALL, rather than a committed one or a per-run one.
          # This container exists for the lifetime of one job, is reachable only
          # on the runner's loopback, and holds nothing but a freshly migrated
          # empty schema. A password here would be a credential-shaped string in
          # a public file that protects nothing — and a secret scanner is right
          # to flag those, so the answer is to not have one.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vizra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vizra -d vizra_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git rev-parse HEAD^1` needs the parent OBJECT; a depth-1 clone
          # grafts it away (measured). This is a fetch depth, NOT a `ref:` pin:
          # refs/pull/N/merge is still the tree that is tested.
          fetch-depth: 2

      # Provenance. On a `pull_request`, actions/checkout with no `ref:` checks
      # out refs/pull/N/merge — the head merged into the CURRENT base tip — so
      # the tree these commands run against is NEITHER the head SHA nor the
      # base SHA, and it moves whenever the base branch moves. A step that
      # records provenance must name the tree it is standing in. See
      # docs/evidence/warroom/2026-09-21-meta-pr3-validate-lane-VERIFY.md,
      # FINDING 5, where exactly this printed a SHA that was not the tree it
      # described. The checkout is deliberately NOT pinned to the head.
      - name: Provenance — which tree this lane tested
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/provenance.sh

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      # The toolchain go.mod pins must be the toolchain that actually runs, or
      # the lane proves nothing about the pinned build.
      - name: Assert the pinned toolchain
        run: |
          set -euo pipefail
          want="$(grep -E '^toolchain ' go.mod | awk '{print $2}')"
          got="$(go version | awk '{print $3}')"
          echo "go.mod pins $want; this runner has $got"
          [ "$want" = "$got" ] || { echo "::error::toolchain mismatch: go.mod pins $want but the runner has $got"; exit 1; }

      - name: Install sqlc
        run: |
          set -euo pipefail
          # ADR-001 pins sqlc 1.31.1. Installed from source at that exact tag so
          # the lane cannot drift onto a newer generator.
          go install github.com/sqlc-dev/sqlc/cmd/sqlc@v1.31.1
          sqlc version

      # ---------------------------------------------------------------
      # THE ANCHOR. Runs OUTSIDE make, BEFORE any `make` line below.
      #
      # One line in the Makefile — `SHELL := /usr/bin/true` or
      # `MAKEFLAGS += -i` — makes every recipe in this repository exit 0
      # without running, so every `make` step below would go green with the
      # whole gate failing underneath it (measured: the war-room verifier's
      # FINDING 8 on vizra-search). No check written INSIDE a Makefile can
      # stop that, because the neutering disarms that check too.
      #
      # scripts/ci-required-guard.py asserts this step exists, is
      # unconditional, is not continue-on-error, and comes BEFORE the first
      # `make` invocation in this job — so deleting it, adding an `if:`, or
      # moving it down turns `ci-required` red.
      # ---------------------------------------------------------------
      - name: Refuse a neutered Makefile
        run: ./scripts/make-integrity-guard.sh

      - name: go.mod and go.sum are tidy
        run: make tidy-check

      - name: make ci
        run: make ci

      # ---------------------------------------------------------------
      # THE SECOND LAYER: the suites, run DIRECTLY, with no make.
      #
      # The anchor above refuses a neutered Makefile by name. These steps are
      # the control for the case the anchor cannot cover: whatever `make ci`
      # did or did not do, the suites run here and a real failing test fails
      # this required lane.
      #
      # `-json` plus scripts/go-test-report.py is sweep B1's other half. A bare
      # `go test ./...` exits 0 having run NOTHING — measured at 5eb2829 with
      # every *_test.go moved aside (PR#6 VERIFY, FINDING 3) — and a
      # non-verbose `go test` prints nothing at all for a SKIPPED test, so no
      # lane here could corroborate a skip count (PR#7 VERIFY, § 1). The report
      # judges `go test`'s own exit code, names every failure and every skip,
      # holds the executed count to a committed floor in scripts/test-floors.json,
      # and prints the counts into this log.
      # ---------------------------------------------------------------
      - name: Unit suite, invoked directly (no make), with counts
        run: |
          set -uo pipefail
          rc=0
          go test -race -count=1 -json ./... > unit-events.json || rc=$?
          echo "$rc" > unit-exit.txt
          echo "go test (unit) exited $rc"
          python3 scripts/go-test-report.py \
            --events unit-events.json --suite unit \
            --floors scripts/test-floors.json --go-exit-file unit-exit.txt

      - name: ci-required guard
        run: ./scripts/ci-required-guard.sh

      - name: Build all three entry points
        run: make build

      - name: vizra version
        run: ./bin/vizra version

      - name: Start Valkey for the integration suites
        run: |
          set -euo pipefail
          # Valkey 9.1.2, digest resolved 2026-09-20 (ADR-001). Run here rather
          # than as a service container so the two-image matrix below can reuse
          # the same step shape.
          docker run -d --name vizra-cache -p 6379:6379 \
            valkey/valkey@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d \
            valkey-server --maxmemory 128mb --maxmemory-policy allkeys-lru --save ''
          for i in $(seq 30); do
            docker exec vizra-cache valkey-cli ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          docker exec vizra-cache valkey-cli ping | grep -q PONG

      # A migration-lane that never touched a database would be a lie. This runs
      # the embedded migrator against real PostgreSQL 18 on an EMPTY database
      # (VZ-FOUND-003 success case).
      #
      # INVOKED DIRECTLY, with no make, from sweep B1. Until then EVERY
      # integration invocation in this repository went through a make recipe, so
      # under any make evasion a failing INTEGRATION test — the migrator against
      # real PostgreSQL 18, the permanent Valkey/Redis-7.2 matrix ADR-001 Q-004
      # exists for — was SILENT, not red (PR#6 VERIFY, FINDING 2). This is the
      # same package set (`./...`), the same flags (`-race -count=1
      # -tags=integration`) and the same services as the `test-integration`
      # recipe; that recipe keeps its own required coverage in both cache-matrix
      # legs below, so nothing is traded away. It costs NO extra runtime: this
      # step replaces the recipe invocation that used to stand here.
      - name: Integration suite, invoked directly (no make), with counts
        env:
          VIZRA_TEST_DATABASE_URL: postgres://vizra@127.0.0.1:5432/vizra_test?sslmode=disable
          VIZRA_TEST_CACHE_URL: redis://127.0.0.1:6379/0
          VIZRA_TEST_CACHE_FLAVOUR: valkey
        run: |
          set -uo pipefail
          # The same refusal the `test-integration` recipe carries: a lane whose
          # services are absent is BLOCKED, never a pass. (Written without the
          # bare word that names the build tool, so this step reads cleanly as a
          # make-free invocation to ci-required-guard check 9 — its ANCHOR
          # heuristic counts that word even inside a comment, by design.)
          if [ -z "${VIZRA_TEST_DATABASE_URL:-}" ]; then
            echo "::error::VIZRA_TEST_DATABASE_URL is not set. This lane is BLOCKED, not passed."
            exit 1
          fi
          rc=0
          go test -race -count=1 -tags=integration -json ./... > int-events.json || rc=$?
          echo "$rc" > int-exit.txt
          echo "go test (integration) exited $rc"
          python3 scripts/go-test-report.py \
            --events int-events.json --suite integration \
            --floors scripts/test-floors.json --go-exit-file int-exit.txt

      # The SAME suite in a random permutation. Verifier FINDING V-1 was an
      # order- and timing-dependent failure that the fixed source order exposed
      # only sometimes; a lane that can go red at random gets re-run until
      # green, and at that point it has stopped being evidence. The seed is in
      # the log, so a failing permutation is reproducible with -shuffle=<seed>.
      - name: Integration suite, shuffled order, invoked directly (no make)
        env:
          VIZRA_TEST_DATABASE_URL: postgres://vizra@127.0.0.1:5432/vizra_test?sslmode=disable
          VIZRA_TEST_CACHE_URL: redis://127.0.0.1:6379/0
          VIZRA_TEST_CACHE_FLAVOUR: valkey
        run: |
          set -uo pipefail
          rc=0
          go test -race -count=1 -shuffle=on -tags=integration -json ./... > int-shuffle-events.json || rc=$?
          echo "$rc" > int-shuffle-exit.txt
          echo "go test (integration, shuffled) exited $rc"
          python3 scripts/go-test-report.py \
            --events int-shuffle-events.json --suite integration \
            --floors scripts/test-floors.json --go-exit-file int-shuffle-exit.txt

      # The machine-readable event streams the counts above were read from, so
      # a reviewer can re-derive them rather than trusting the summary. The
      # previous version of this step published `bin/` under the name
      # "build-test-logs" and no test log at all (PR#7 VERIFY, recorded
      # observations).
      - name: Upload the test event streams
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-test-events-${{ github.sha }}
          path: |
            unit-events.json
            int-events.json
            int-shuffle-events.json
            unit-exit.txt
            int-exit.txt
            int-shuffle-exit.txt
          if-no-files-found: warn
          retention-days: 7

  # ADR-001 Q-004: go-redis publishes no Valkey support statement and Valkey
  # publishes no formal protocol-compatibility guarantee, so the cache lane is a
  # PERMANENT two-image matrix — pinned Valkey and Redis 7.2.x — from the first
  # Redis-using code, for the life of the project.
  cache-matrix-leg:
    name: cache-matrix-leg
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          # valkey/valkey:9.1.2, digest resolved 2026-09-20.
          - flavour: valkey
            image: valkey/valkey@sha256:c123e3715db63d06d4ad6964884037aa0d5d4d703939b9929954112889708e1d
            server: valkey-server
            cli: valkey-cli
          # redis:7.2, digest resolved 2026-09-20. Redis 7.2 is the last BSD-3
          # line and still receives OSS security releases; this leg switches to
          # Redis 8 if 7.2 stops receiving fixes (ADR-001).
          - flavour: redis
            image: redis@sha256:0637954999d01b7c9ce9167db2da50656e2590d3b884f1c600c5f63bb6e6773c
            server: redis-server
            cli: redis-cli

    services:
      postgres:
        image: postgres@sha256:86c951e05bf56c93d95d397747fb8820ac76cc3bedb78f43abd83eedbe3666ae
        env:
          POSTGRES_USER: vizra
          # NO PASSWORD AT ALL, rather than a committed one or a per-run one.
          # This container exists for the lifetime of one job, is reachable only
          # on the runner's loopback, and holds nothing but a freshly migrated
          # empty schema. A password here would be a credential-shaped string in
          # a public file that protects nothing — and a secret scanner is right
          # to flag those, so the answer is to not have one.
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: vizra_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U vizra -d vizra_test"
          --health-interval 5s --health-timeout 5s --health-retries 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `git rev-parse HEAD^1` needs the parent OBJECT; a depth-1 clone
          # grafts it away (measured). This is a fetch depth, NOT a `ref:` pin:
          # refs/pull/N/merge is still the tree that is tested.
          fetch-depth: 2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Provenance. On a `pull_request`, actions/checkout with no `ref:` checks
      # out refs/pull/N/merge — the head merged into the CURRENT base tip — so
      # the tree these commands run against is NEITHER the head SHA nor the
      # base SHA, and it moves whenever the base branch moves. A step that
      # records provenance must name the tree it is standing in. See
      # docs/evidence/warroom/2026-09-21-meta-pr3-validate-lane-VERIFY.md,
      # FINDING 5, where exactly this printed a SHA that was not the tree it
      # described. The checkout is deliberately NOT pinned to the head.
      - name: Provenance — which tree this lane tested
        env:
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: ./scripts/provenance.sh

      - name: Start ${{ matrix.flavour }}
        run: |
          set -euo pipefail
          docker run -d --name cache -p 6379:6379 ${{ matrix.image }} \
            ${{ matrix.server }} --maxmemory 128mb --maxmemory-policy allkeys-lru --save ''
          for i in $(seq 30); do
            docker exec cache ${{ matrix.cli }} ping 2>/dev/null | grep -q PONG && break
            sleep 1
          done
          docker exec cache ${{ matrix.cli }} ping | grep -q PONG
          docker exec cache ${{ matrix.cli }} info server | grep -Ei 'version|server_name' || true

      # ---------------------------------------------------------------
      # THE ANCHOR. Runs OUTSIDE make, BEFORE any `make` line below.
      #
      # One line in the Makefile — `SHELL := /usr/bin/true` or
      # `MAKEFLAGS += -i` — makes every recipe in this repository exit 0
      # without running, so every `make` step below would go green with the
      # whole gate failing underneath it (measured: the war-room verifier's
      # FINDING 8 on vizra-search). No check written INSIDE a Makefile can
      # stop that, because the neutering disarms that check too.
      #
      # scripts/ci-required-guard.py asserts this step exists, is
      # unconditional, is not continue-on-error, and comes BEFORE the first
      # `make` invocation in this job — so deleting it, adding an `if:`, or
      # moving it down turns `ci-required` red.
      # ---------------------------------------------------------------
      - name: Refuse a neutered Makefile
        run: ./scripts/make-integrity-guard.sh

      - name: Integration tests against ${{ matrix.flavour }}
        env:
          VIZRA_TEST_DATABASE_URL: postgres://vizra@127.0.0.1:5432/vizra_test?sslmode=disable
          VIZRA_TEST_CACHE_URL: redis://127.0.0.1:6379/0
          VIZRA_TEST_CACHE_FLAVOUR: ${{ matrix.flavour }}
        run: make test-integration

      # See the shuffled step in build-test: order dependence is checked on
      # BOTH cache flavours, because an order-dependent failure that only
      # appears against one server is exactly the kind of thing this permanent
      # matrix exists to catch (ADR-001 Q-004).
      - name: Integration tests against ${{ matrix.flavour }}, shuffled order
        env:
          VIZRA_TEST_DATABASE_URL: postgres://vizra@127.0.0.1:5432/vizra_test?sslmode=disable
          VIZRA_TEST_CACHE_URL: redis://127.0.0.1:6379/0
          VIZRA_TEST_CACHE_FLAVOUR: ${{ matrix.flavour }}
        run: make test-integration-shuffle

  # The aggregate. `ci-required` requires the context `cache-matrix`; GitHub
  # reports each matrix leg under a name carrying its matrix values, so without
  # this job that context would never appear and the fan-in would time out
  # rather than gate anything.
  #
  # `if: always()` plus an explicit result check is deliberate: without it a
  # CANCELLED or SKIPPED matrix would leave this job skipped, and a skipped
  # required lane is not a pass.
  cache-matrix:
    name: cache-matrix
    needs: cache-matrix-leg
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Every cache matrix leg must have succeeded
        run: |
          set -euo pipefail
          result='${{ needs.cache-matrix-leg.result }}'
          echo "cache-matrix-leg result: $result"
          if [ "$result" != "success" ]; then
            echo "::error::a cache matrix leg did not succeed (result: $result). ADR-001 Q-004 makes this matrix permanent: a skipped or cancelled leg is not a pass."
            exit 1
          fi
          echo "both legs (pinned Valkey, Redis 7.2) succeeded"
